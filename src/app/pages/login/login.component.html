<app-navbar></app-navbar>
<div class="flex items-center justify-center h-[calc(100vh-64px)] bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 px-4 transition-colors duration-300 overflow-hidden">
  <div class="w-full max-w-sm md:max-w-md lg:max-w-lg card bg-white dark:bg-gray-800 shadow-2xl rounded-lg border border-gray-200 dark:border-gray-700">
    <div class="card-body p-6 sm:p-8">
      <h2 class="card-title text-2xl sm:text-3xl font-bold text-center text-gray-800 dark:text-white mb-6">Login</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded relative text-sm">
          {{ errorMessage }}
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
          <input 
            formControlName="email"
            type="email" 
            placeholder="Enter your email" 
            class="input input-bordered w-full px-4 py-2 border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition" 
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
          <input 
            formControlName="password"
            type="password" 
            placeholder="Enter your password" 
            class="input input-bordered w-full px-4 py-2 border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition" 
          />
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 text-blue-600 rounded" />
            <span class="ml-2 text-gray-700 dark:text-gray-300">Remember me</span>
          </label>
          <a href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 text-white font-semibold py-2 rounded-lg transition duration-200">
          Login
        </button>
      </form>

      <div class="divider my-4 dark:border-gray-600">OR</div>

      <p class="text-center text-gray-600 dark:text-gray-400 text-sm">
        No account? 
        <a routerLink="/register" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-semibold transition">
          Register here
        </a>
      </p>

      <p class="text-center text-xs text-gray-500 dark:text-gray-500 mt-4">
        By logging in, you agree to our <a href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">Terms of Service</a>
      </p>
    </div>
  </div>
</div>
