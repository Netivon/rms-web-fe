<app-navbar></app-navbar>
<div>
  <!-- <h2 class="text-2xl font-bold mb-4">My Properties</h2> -->
  <button class="btn btn-success mb-4" (click)="openAddModal()">+ Add Property</button>

  <div class="overflow-x-auto">
    <table class="table w-full">
      <thead>
        <tr>
          <th>Address</th>
          <th>Default Rent</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of properties">
          <td>{{ p.address }}</td>
          <td>${{ p.defaultRent }}</td>
          <td>
            <button class="btn btn-sm btn-outline">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal: popup form -->
<div class="modal" [class.modal-open]="showModal">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Add Property</h3>
    <form (ngSubmit)="saveProperty()" class="space-y-4 mt-4">
      <div>
        <label class="label">
          <span class="label-text">Address</span>
        </label>
        <input type="text" class="input input-bordered w-full" [(ngModel)]="newProperty.address" name="address" required />
      </div>
      <div>
        <label class="label">
          <span class="label-text">Default Rent</span>
        </label>
        <input type="number" class="input input-bordered w-full" [(ngModel)]="newProperty.defaultRent" name="defaultRent" required min="1" />
      </div>
      <div class="modal-action">
        <button type="button" class="btn" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!newProperty.address || !newProperty.defaultRent || newProperty.defaultRent <= 0">Save</button>
      </div>
    </form>
  </div>
</div>
