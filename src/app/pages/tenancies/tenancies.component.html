<app-navbar></app-navbar>

<div>
  <!-- <h2 class="text-2xl font-bold mb-4">My Tenancies</h2> -->
  <button class="btn btn-success mb-4" (click)="openAddModal()">+ Add Tenancy</button>

  <div class="overflow-x-auto">
    <table class="table w-full">
      <thead>
        <tr>
          <th>Property</th>
          <th>Tenant</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Rent</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of tenancies">
          <td>{{ t.property }}</td>
          <td>{{ t.tenant }}</td>
          <td>{{ t.startDate }}</td>
          <td>{{ t.endDate }}</td>
          <td>${{ t.rent }}</td>
          <td>
            <button class="btn btn-sm btn-outline">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal: popup form -->
  <div class="modal" [class.modal-open]="showModal">
    <div class="modal-box">
      <h3 class="font-bold text-lg">Add Tenancy</h3>
      <form (ngSubmit)="saveTenancy()" class="space-y-4 mt-4">
        <div>
          <label class="label">
            <span class="label-text">Property</span>
          </label>
          <input type="text" class="input input-bordered w-full" [(ngModel)]="newTenancy.property" name="property" required />
        </div>
        <div>
          <label class="label">
            <span class="label-text">Tenant</span>
          </label>
          <input type="text" class="input input-bordered w-full" [(ngModel)]="newTenancy.tenant" name="tenant" required />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="label">
              <span class="label-text">Start Date</span>
            </label>
            <input type="date" class="input input-bordered w-full" [(ngModel)]="newTenancy.startDate" name="startDate" required />
          </div>
          <div>
            <label class="label">
              <span class="label-text">End Date</span>
            </label>
            <input type="date" class="input input-bordered w-full" [(ngModel)]="newTenancy.endDate" name="endDate" />
          </div>
        </div>
        <div>
          <label class="label">
            <span class="label-text">Rent</span>
          </label>
          <input type="number" class="input input-bordered w-full" [(ngModel)]="newTenancy.rent" name="rent" required min="1" />
        </div>
        <div class="modal-action">
          <button type="button" class="btn" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="!newTenancy.property || !newTenancy.tenant || !newTenancy.startDate || !newTenancy.rent || newTenancy.rent <= 0">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
