<app-navbar></app-navbar>

<div class="flex items-center justify-center min-h-[calc(100vh-64px)] bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 px-4 transition-colors duration-300 py-8">
  <div class="w-full max-w-sm md:max-w-md lg:max-w-lg card bg-white dark:bg-gray-800 shadow-2xl rounded-lg border border-gray-200 dark:border-gray-700">
    <div class="card-body p-6 sm:p-8">
      <h2 class="card-title text-2xl sm:text-3xl font-bold text-center text-gray-800 dark:text-white mb-6">
        Create an Account
      </h2>

      <form class="space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Account Type</label>
          <div class="flex gap-4">
            <label class="flex items-center cursor-pointer">
              <input
                type="radio"
                name="userType"
                value="landlord"
                formControlName="userType"
                class="w-4 h-4 text-blue-600 cursor-pointer"
              />
              <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Landlord</span>
            </label>
            <label class="flex items-center cursor-pointer">
              <input
                type="radio"
                name="userType"
                value="tenant"
                formControlName="userType"
                class="w-4 h-4 text-blue-600 cursor-pointer"
              />
              <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Tenant</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
          <input
            type="text"
            placeholder="Enter your name"
            formControlName="fullName"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
          <input
            type="email"
            placeholder="example@email.com"
            formControlName="email"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
          <input
            type="password"
            placeholder="Enter a strong password"
            formControlName="password"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Confirm Password</label>
          <input
            type="password"
            placeholder="Re-enter your password"
            formControlName="confirmPassword"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 rounded-lg focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent transition"
            required
          />
        </div>

        <div class="flex items-center">
          <input type="checkbox" id="terms" class="w-4 h-4 text-blue-600 rounded" required />
          <label for="terms" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
            I agree to the <a href="#" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">Terms of Service</a>
          </label>
        </div>

        <button
          type="submit"
          [disabled]="!registerForm.valid"
          class="btn btn-primary w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-2 rounded-lg transition duration-200"
        >
          Register
        </button>
      </form>

      <div class="divider my-4 dark:border-gray-600">OR</div>

      <p class="text-center text-gray-600 dark:text-gray-400 text-sm">
        Already have an account?
        <a routerLink="/login" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-semibold transition">
          Login here
        </a>
      </p>
    </div>
  </div>
</div>
